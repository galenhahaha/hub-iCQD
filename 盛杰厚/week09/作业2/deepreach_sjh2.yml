          role: system
          text: 你是研究资料抽取员。下面提供了若干网页的标题、来源与摘要，以及本次研究的子问题。
        - id: e1-usr-0001-0000-4000-8000-000000000001
          role: user
          text: '任务：从这些页面中抽取可支撑子问题的事实/结论作为证据。要求：

            1. claim 须为陈述句，忠于原文，不得编造。

            2. 每条证据都要带上 source_url（来自对应页面的 url）。

            3. 与子问题无关、或信息价值低的内容，不要抽取。

            4. 若页面信息不足以回答子问题，宁可少抽也不要臆造。

            5. 只输出 JSON，格式如下，不要输出任何解释文字：

            {"evidence": [{"claim": "事实陈述", "source_url": "页面url", "supports": "对应子问题"}]}


            研究子问题：

            {{#1789655300000.sub_questions#}}


            页面列表（JSON）：

            {{#1789655400000.pages_json#}}'
        selected: false
        title: 第1轮抽取
