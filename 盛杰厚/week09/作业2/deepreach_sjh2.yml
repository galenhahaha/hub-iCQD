    - data:
        code: "import json\nimport re\n\ndef main(text: str) -> dict:\n    raw = text\
          \ or \"\"\n    m = re.search(r\"```(?:json)?\\s*(\\{.*?\\})\\s*```\", raw,\
          \ re.DOTALL)\n    if m:\n        raw = m.group(1)\n    else:\n        s\
          \ = raw.find(\"{\")\n        e = raw.rfind(\"}\")\n        if s != -1 and\
          \ e != -1 and e > s:\n            raw = raw[s:e+1]\n    try:\n        data\
          \ = json.loads(raw)\n    except Exception:\n        data = {}\n    evidence\
          \ = []\n    for ev in data.get(\"evidence\", []):\n        if isinstance(ev,\
          \ dict) and ev.get(\"claim\") and ev.get(\"source_url\"):\n            evidence.append({\n\
          \                \"claim\": str(ev.get(\"claim\")),\n                \"\
          source_url\": str(ev.get(\"source_url\")),\n                \"supports\"\
          : str(ev.get(\"supports\") or \"\"),\n            })\n    return {\"evidence\"\
          : evidence, \"evidence_json\": json.dumps(evidence, ensure_ascii=False)}"
