            \n要求：\n1. 拆出 2~4 个互不重叠的子问题，尽量覆盖主题的不同维度（如市场规模、竞争格局、技术路线、政策、区域等）。\n2. 每个子问题给出\
            \ 2~3 个适合搜索引擎检索的中文关键词。\n3. 只输出结构化结果, 结构化格式为：```json\n[{\n    \"text\"\
            : \"子问题1\",\n    \"keywords\": [\"子问题1的关键词1\", \"子问题1的关键词2\"]\n},{\n \
            \   \"text\": \"子问题2\",\n    \"keywords\":  [\"子问题2的关键词1\", \"子问题2的关键词2\"\
            ]\n}]\n```，不要输出任何解释文字。\n\n"
