  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1m0-14c3-2 6-2 9-1v14c-3-1-6-1-9 1V6Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>

</defs></svg>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="研究导航">
    <a class="brand" href="/" aria-label="知序首页"><span class="brand-mark"><svg width="23" height="23"><use href="#i-book"/></svg></span><span><strong>知序</strong><small>RESEARCH STUDIO</small></span></a>
    <button class="new-button" id="new-research"><svg><use href="#i-plus"/></svg><span>开启新研究</span><span>↗</span></button>
    <div class="side-label">研究记录 <span id="history-count"></span></div>
    <nav class="history" id="history" aria-label="历史研究"><p class="history-empty">正在读取研究记录…</p></nav>
    <div class="side-footer"><strong><span class="live-dot"></span>让每一个结论，有迹可循</strong>检索 · 阅读 · 迭代 · 综合</div>
  </aside>
  <main>
    <header class="topbar"><div class="breadcrumb"><button class="menu-toggle" id="menu-toggle" aria-label="打开研究记录" aria-expanded="false" aria-controls="sidebar">☰</button><span>工作空间</span><span>/</span><span>深度研究助手</span></div><div class="top-note"><svg><use href="#i-check"/></svg>基于来源，形成洞见</div></header>
    <div class="workspace">
      <div class="eyebrow">FROM QUESTIONS TO CLARITY</div>
      <h1>从一个问题，<em>到一份洞见。</em></h1>
      <p class="intro">把好奇交给研究。从多轮检索到交叉梳理，为你整理一份有据可循的报告。</p>
      <form id="research-form" class="composer">
        <label class="input-label" for="topic">你想深入了解什么？<span>一个具体的问题，会带来更好的研究</span></label>
        <textarea id="topic" name="topic" maxlength="500" required rows="2" placeholder="例如：中小企业如何选择适合自己的 RAG 知识库方案？"></textarea>
        <div class="composer-footer"><div class="mode"><svg><use href="#i-layers"/></svg>深度研究<span aria-hidden="true"> · </span><span>多轮检索与综合</span></div><button class="primary" type="submit" id="submit"><span>开始研究</span><svg><use href="#i-arrow"/></svg></button></div>
      </form>
      <div class="suggestions"><span>试着研究</span><button type="button" data-topic="中小企业 RAG 知识库技术选型：比较向量检索与混合检索的适用场景、成本和评测方法">RAG 技术选型 ↗</button><button type="button" data-topic="2026 年 AI 搜索产品的核心能力与差异：比较来源引用、深度研究和使用场景">AI 搜索产品对比 ↗</button><button type="button" data-topic="企业部署开源大模型时，如何权衡推理成本、数据隐私与效果？">开源大模型部署 ↗</button></div>
      <div class="notice" id="notice" role="alert" hidden><span id="notice-text"></span><button id="retry" type="button">重试连接</button></div>
      <section class="metrics" aria-label="研究概览">
        <div class="metric"><div class="metric-label"><svg><use href="#i-clock"/></svg>研究状态</div><div class="metric-value"><strong class="status-word" id="status" role="status" aria-live="polite">准备就绪</strong></div></div>
        <div class="metric"><div class="metric-label"><svg><use href="#i-search"/></svg>参考来源</div><div class="metric-value"><strong id="source-count">—</strong><span>个</span></div></div>
        <div class="metric"><div class="metric-label"><svg><use href="#i-layers"/></svg>检索轮次</div><div class="metric-value"><strong id="round-count">—</strong><span>轮</span></div></div>
        <div class="metric"><div class="metric-label"><svg><use href="#i-file"/></svg>研究分节</div><div class="metric-value"><strong id="section-count">—</strong><span>节</span></div></div>
      </section>
      <section class="results" aria-label="研究成果">
        <div class="result-toolbar"><div class="tabs" role="tablist" aria-label="成果类型">
          <button class="tab" id="tab-report" role="tab" aria-selected="true" aria-controls="panel" data-tab="report">研究报告</button>
          <button class="tab" id="tab-sources" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="sources">参考来源 <span id="tab-source-count">0</span></button>
          <button class="tab" id="tab-process" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="process">研究过程</button>
          <button class="tab" id="tab-confidence" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="confidence">置信度</button>
        </div><button class="export" id="export" disabled aria-label="导出 Markdown 报告"><svg><use href="#i-download"/></svg>导出报告</button></div>
        <div id="panel" class="panel" role="tabpanel" aria-labelledby="tab-report" tabindex="0"></div>
      </section>
      <footer class="footnote"><span>AI 生成的内容可能存在偏差，请结合原始来源判断。</span><span>STAY CURIOUS. GO DEEPER.</span></footer>
    </div>
  </main>
</div>
<template id="empty-template"><div class="empty"><div class="empty-art" aria-hidden="true"><div class="art-card"><svg><use href="#i-search"/></svg><div class="art-line"></div></div><span class="connector"></span><div class="art-card"><svg><use href="#i-book"/></svg><div class="art-line"></div><div class="art-line" style="width:16px"></div></div><span class="connector"></span><div class="art-card"><svg><use href="#i-file"/></svg><div class="art-line"></div></div></div><h2>每一份好研究，都始于好奇</h2><p>输入你关心的主题。研究助手将拆解问题、检索资料，<br>通过多轮阅读与思考，让答案逐渐清晰。</p><div class="workflow"><span><b>1</b>规划问题</span><span><b>2</b>检索与阅读</span><span><b>3</b>生成报告</span></div></div></template>
<script>
  'use strict';
  const $ = id => document.getElementById(id);
  const state = {id:null, record:null, tab:'report', timer:null, version:0, history:[], loading:false};
  const statusNames = {pending:'等待开始',running:'研究进行中',completed:'研究已完成',failed:'研究未完成'};
  const active = record => record && ['pending','running'].includes(record.status);
  function el(tag, className, text) {const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
  function safeURL(value) {try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:null;}catch{return null;}}
  function link(ref, label) {const href=safeURL(ref.url);const node=el(href?'a':'span','',label||ref.title||ref.url||'未命名来源');if(href){node.href=href;node.target='_blank';node.rel='noopener noreferrer';}return node;}
  function dateText(value) {const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
  function notice(message) {$('notice').hidden=!message;$('notice-text').textContent=message||'';}
  async function api(path, options={}) {const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);try{const res=await fetch(path,{...options,signal:controller.signal,headers:{'Content-Type':'application/json',...options.headers}});if(!res.ok){let message=`请求失败（${res.status}），请稍后重试。`;try{const data=await res.json();if(typeof data.detail==='string')message=data.detail;else if(res.status===422)message='请输入 1–500 字的研究主题。';}catch{}throw new Error(message);}return await res.json();}catch(error){if(error.name==='AbortError')throw new Error('连接超时，正在等待服务响应。');throw error;}finally{clearTimeout(timeout);}}
  function drawHistory() {$('history').replaceChildren();$('history-count').textContent=state.history.length?`· ${state.history.length}`:'';if(!state.history.length){$('history').append(el('p','history-empty','还没有研究记录。\n从你的第一个问题开始。'));return;}for(const record of state.history){const button=el('button','history-button'+(record.research_id===state.id?' active':''));button.type='button';button.title=record.topic;button.setAttribute('aria-label',`${record.topic}，${statusNames[record.status]||record.status}`);button.append(el('span',`dot ${record.status}`),el('span','history-text',record.topic));button.addEventListener('click',()=>selectRecord(record.research_id));$('history').append(button);}}
  async function loadHistory() {state.history=await api('/api/research');drawHistory();}
  function mergeHistory(record) {const index=state.history.findIndex(item=>item.research_id===record.research_id);if(index<0)state.history.unshift(record);else state.history[index]=record;drawHistory();}
  function setTab(tab) {state.tab=tab;document.querySelectorAll('[data-tab]').forEach(button=>{const selected=button.dataset.tab===tab;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;});$('panel').setAttribute('aria-labelledby',`tab-${tab}`);renderPanel();}
  function updateURL(id) {const url=new URL(location.href);if(id)url.searchParams.set('research',id);else url.searchParams.delete('research');history.replaceState(null,'',url);}
  function closeMenu() {$('sidebar').classList.remove('open');$('menu-toggle').setAttribute('aria-expanded','false');}
  async function selectRecord(id) {clearTimeout(state.timer);state.version++;state.id=id;state.record=null;notice('');updateURL(id);closeMenu();render();await poll(state.version);}
  async function poll(version) {if(version!==state.version||!state.id)return;try{const record=await api(`/api/research/${encodeURIComponent(state.id)}`);if(version!==state.version)return;state.record=record;mergeHistory(record);notice(record.status==='failed'?(record.error||'研究未完成，请重新发起研究。'):'');render();if(active(record))state.timer=setTimeout(()=>poll(version),2000);}catch(error){if(version!==state.version)return;notice(`读取研究失败：${error.message}`);state.timer=setTimeout(()=>poll(version),5000);}}
  function render() {const r=state.record;$('status').textContent=r?statusNames[r.status]:(state.id?'正在读取':'准备就绪');$('status').className='status-word'+(r?.status==='failed'?' failed':'');$('source-count').textContent=r?r.sources.length:'—';$('round-count').textContent=r?(r.process?.iterations||0):'—';$('section-count').textContent=r?(r.report?.sections.length??r.draft.length):'—';$('tab-source-count').textContent=r?r.sources.length:0;$('export').disabled=!r?.report;renderPanel();}
  function heading(title, parent) {const section=el('section','section');section.append(el('h3','',title));parent.append(section);return section;}
  function placeholder(title, description) {const box=el('div','empty');box.append(el('h2','',title),el('p','',description));return box;}
  function recordHeader(r) {const header=el('div','record-header');const meta=el('div','record-meta');meta.append(el('span',`badge ${r.status}`,statusNames[r.status]),el('span','',`更新于 ${dateText(r.updated_at)}`));header.append(meta,el('h2','',r.report?.title||r.topic));return header;}
  function renderPanel() {const panel=$('panel');panel.replaceChildren();const r=state.record;if(!r){if(state.id)panel.append(placeholder('正在读取研究','正在获取已保存的研究记录…'));else panel.append($('empty-template').content.cloneNode(true));return;}if(state.tab==='report')renderReport(r,panel);if(state.tab==='sources')renderSources(r,panel);if(state.tab==='process')renderProcess(r,panel);if(state.tab==='confidence')renderConfidence(r,panel);}
  function renderReport(r,panel) {panel.append(recordHeader(r));if(active(r)){const progress=el('div','running-note');progress.append(el('span','spinner'),el('span','',r.draft.length?'已保存阶段性草稿，研究仍在继续…':'正在拆解问题并检索资料，请稍候…'));panel.append(progress);}if(!r.report){if(r.draft.length){panel.append(el('p','section-intro','阶段性草稿 · 完整报告生成后会自动更新'));for(const block of r.draft)heading(block.keyword,panel).append(el('div','prose',block.text));}else panel.append(placeholder(r.status==='failed'?'研究暂未生成报告':'让研究再深入一点',r.status==='failed'?'可查看研究过程中的已保存结果，或重新开始研究。':'研究过程与参考来源会随着进展持续更新。'));return;}const report=r.report;panel.append(el('div','report-summary',report.summary));for(const section of report.sections){const node=heading(section.heading,panel);node.append(el('div','prose',section.body));for(const conclusion of section.conclusions||[])renderConclusion(conclusion,node);}const conclusions=heading('关键结论',panel);if(!report.key_conclusions.length)conclusions.append(el('p','subtle','暂无关键结论。'));for(const conclusion of report.key_conclusions)renderConclusion(conclusion,conclusions);const questions=heading('遗留问题',panel);if(report.open_questions.length){const list=el('ul','questions');for(const question of report.open_questions)list.append(el('li','',question));questions.append(list);}else questions.append(el('p','subtle','本次研究未列出其他问题。'));if(r.report_html){const toggle=el('button','preview-button','查看排版预览');toggle.type='button';toggle.setAttribute('aria-expanded','false');toggle.addEventListener('click',()=>{const current=panel.querySelector('iframe');if(current){current.remove();toggle.textContent='查看排版预览';toggle.setAttribute('aria-expanded','false');return;}const frame=el('iframe','preview');frame.title='研究报告排版预览';frame.setAttribute('sandbox','');frame.referrerPolicy='no-referrer';const doc=new DOMParser().parseFromString(r.report_html,'text/html');const csp=doc.createElement('meta');csp.httpEquiv='Content-Security-Policy';csp.content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'";doc.head.prepend(csp);frame.srcdoc='<!DOCTYPE html>'+doc.documentElement.outerHTML;panel.append(frame);toggle.textContent='收起排版预览';toggle.setAttribute('aria-expanded','true');});panel.append(toggle);}}
  function renderConclusion(conclusion,parent) {const node=el('div','conclusion');node.append(el('span','',conclusion.text));if(conclusion.is_model_inference||!conclusion.sources.length)node.append(el('span','inference','模型推断'));if(conclusion.sources.length){const citations=el('div','citations');for(const ref of conclusion.sources)citations.append(link(ref));node.append(citations);}parent.append(node);}
  function renderSources(r,panel) {panel.append(el('p','section-intro',`已收集 ${r.sources.length} 个去重来源。点击标题查看原始资料。`));if(!r.sources.length){panel.append(placeholder('还没有参考来源','检索完成后，来源标题、摘要和原始链接将在这里展示。'));return;}r.sources.forEach((source,index)=>{const card=el('article','source-card');const top=el('div','source-top');top.append(el('span','source-number',String(index+1).padStart(2,'0')),link(source));card.append(top,el('div','source-meta',[source.site_name,source.url,source.accessed_at?`访问于 ${source.accessed_at}`:''].filter(Boolean).join(' · ')),el('p','prose',source.snippet||'该来源未提供摘要。'));panel.append(card);});}
  function renderProcess(r,panel) {const process=r.process;if(!process){panel.append(placeholder('研究正在准备中','问题规划与每一步检索、摘要、补检判断都会记录在这里。'));return;}panel.append(el('p','section-intro',`共 ${process.iterations} 轮检索 · ${process.search_queries.length} 个检索词 · ${process.reviewed_urls.length} 个已读来源`));const timeline=el('div','timeline');const names={plan:'规划研究问题',search:'检索参考资料',summarize:'提取与整理',judge:'判断是否补检'};for(const step of process.steps){const node=el('article','step');const title=el('div','step-title');title.append(el('span','',names[step.type]||step.type),el('small','',step.round?`第 ${step.round} 轮`:'研究规划'));const detail=step.detail||{};let text='';if(step.type==='plan')text=(detail.keywords||[]).join(' / ');else if(step.type==='search')text=`${detail.keyword||''}\n找到 ${detail.results??0} 条结果${detail.error?' · '+detail.error:''}`;else if(step.type==='summarize')text=`${detail.keyword||''}\n已整理 ${detail.chars??0} 字阶段性摘要`;else if(step.type==='judge')text=`${detail.sufficient?'资料已足够，进入报告综合':'评估补检需求'}\n${detail.reason||''}${detail.new_keywords?.length?'\n补检关键词：'+detail.new_keywords.join(' / '):''}`;else text=JSON.stringify(detail);node.append(title,el('div','step-detail',text));timeline.append(node);}panel.append(timeline);if(process.reviewed_urls.length){const details=el('details','section');details.append(el('summary','subtle','查看已读页面'));const list=el('ul','questions');for(const url of process.reviewed_urls){const item=el('li');item.append(link({url}));list.append(item);}details.append(list);panel.append(details);}}
  function renderConfidence(r,panel) {const confidence=r.confidence;if(!confidence){panel.append(placeholder('置信度将在综合后给出','依据去重来源数量与资料日期生成说明，帮助你判断结论的参考价值。'));return;}const box=el('div','confidence-box');box.append(el('div','confidence-grade',({high:'高',medium:'中',low:'低'})[confidence.overall]||confidence.overall));const copy=el('div');copy.append(el('h3','','整体置信度'),el('p','',`信息截止日期：${confidence.info_cutoff||'未提供'}`));box.append(copy);panel.append(box);const list=el('ul','confidence-list');for(const note of confidence.notes)list.append(el('li','',note));panel.append(list);const inferred=r.report?.key_conclusions.filter(c=>c.is_model_inference||!c.sources.length)||[];const section=heading('结论的来源说明',panel);section.append(el('p','prose',`关键结论中有 ${inferred.length} 条标注为“模型推断”。来源数量反映资料覆盖程度，不代表事实已经得到独立核验。`));}
  function exportReport() {const r=state.record;if(!r?.report)return;const report=r.report;const lines=[`# ${report.title}`,'',report.summary,''];for(const section of report.sections)lines.push(`## ${section.heading}`,'',section.body,'');lines.push('## 关键结论','');for(const c of report.key_conclusions){lines.push(`- ${c.text}${c.is_model_inference||!c.sources.length?'（模型推断）':''}`);for(const ref of c.sources)if(safeURL(ref.url))lines.push(`  - ${ref.title||ref.url}：${ref.url}`);}lines.push('','## 遗留问题','',...report.open_questions.map(q=>`- ${q}`),'','## 参考来源','',...r.sources.map(s=>`- ${s.title||s.url}：${s.url}`),'','## 置信度','',`评级：${r.confidence?.overall||'未提供'}；信息截止日期：${r.confidence?.info_cutoff||'未提供'}`,...(r.confidence?.notes||[]).map(n=>`- ${n}`),'','## 研究过程','',`检索轮次：${r.process?.iterations||0}`,`检索词：${r.process?.search_queries.join('、')||''}`);const url=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\n')],{type:'text/markdown;charset=utf-8'}));const anchor=el('a');anchor.href=url;anchor.download=`研究报告-${r.research_id.slice(0,8)}.md`;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  $('research-form').addEventListener('submit',async event=>{event.preventDefault();if(state.loading)return;const topic=$('topic').value.trim();if(!topic){$('topic').setCustomValidity('请输入研究主题，不能只有空白。');$('topic').reportValidity();return;}state.loading=true;$('submit').disabled=true;notice('');const version=state.version;try{const accepted=await api('/api/research',{method:'POST',body:JSON.stringify({topic})});if(version===state.version){setTab('report');await selectRecord(accepted.research_id);}else{await loadHistory();}}catch(error){notice(`提交失败：${error.message}`);}finally{state.loading=false;$('submit').disabled=false;}});
  $('topic').addEventListener('input',()=>$('topic').setCustomValidity(''));
  $('new-research').addEventListener('click',()=>{clearTimeout(state.timer);state.version++;state.id=null;state.record=null;updateURL(null);notice('');setTab('report');render();drawHistory();closeMenu();$('topic').value='';$('topic').focus();loadHistory().catch(()=>{});});
  document.querySelectorAll('[data-topic]').forEach(button=>button.addEventListener('click',()=>{$('topic').value=button.dataset.topic;$('topic').setCustomValidity('');$('topic').focus();}));
  document.querySelectorAll('[data-tab]').forEach(button=>{button.addEventListener('click',()=>setTab(button.dataset.tab));button.addEventListener('keydown',event=>{const tabs=[...document.querySelectorAll('[data-tab]')];let index=tabs.indexOf(button);if(event.key==='ArrowRight')index=(index+1)%tabs.length;else if(event.key==='ArrowLeft')index=(index+tabs.length-1)%tabs.length;else if(event.key==='Home')index=0;else if(event.key==='End')index=tabs.length-1;else return;event.preventDefault();tabs[index].focus();setTab(tabs[index].dataset.tab);});});
  $('export').addEventListener('click',exportReport);
  $('retry').addEventListener('click',async()=>{clearTimeout(state.timer);notice('');if(state.id){state.version++;await poll(state.version);}else{try{await loadHistory();}catch(error){notice(`读取历史失败：${error.message}`);}}});
  $('menu-toggle').addEventListener('click',()=>{const open=$('sidebar').classList.toggle('open');$('menu-toggle').setAttribute('aria-expanded',String(open));});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu();});
  window.addEventListener('pagehide',()=>clearTimeout(state.timer));
  (async()=>{render();try{await loadHistory();}catch(error){notice(`读取历史失败：${error.message}`);}const id=new URL(location.href).searchParams.get('research');if(id)await selectRecord(id);})();
</script>
