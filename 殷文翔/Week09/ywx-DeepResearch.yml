    - data:
        code: "import json\ndef main(body: str) -> dict:\n    try:\n        payload\
          \ = json.loads(body)\n    except (json.JSONDecodeError, TypeError) as exc:\n\
          \        raise ValueError(\n            \"body 不是有效 JSON，请绑定 HTTP 节点的原始\
          \ body 输出。\"\n        ) from exc\n\n    if not isinstance(payload, dict):\n\
          \        raise ValueError(\"Bocha 响应必须是 JSON 对象。\")\n\n    if payload.get(\"\
          code\") not in (200, \"200\"):\n        raise ValueError(\n            f\"\
          Bocha 搜索失败，业务状态码：{payload.get('code')}\"\n        )\n\n    data = payload.get(\"\
          data\") or {}\n    pages = (data.get(\"webPages\") or {}).get(\"value\"\
          ) or []\n\n    results = []\n    seen = set()\n\n    def text(value):\n\
          \        return value.strip() if isinstance(value, str) else \"\"\n\n  \
          \  for page in pages:\n        if not isinstance(page, dict):\n        \
          \    continue\n\n        url = text(page.get(\"url\"))\n        if not url\
          \ or url in seen:\n            continue\n        seen.add(url)\n\n     \
          \   snippet = (\n            text(page.get(\"snippet\"))\n            or\
          \ text(page.get(\"summary\"))\n        )\n\n        results.append({\n \
          \           \"title\": text(page.get(\"name\")),\n            \"url\": url,\n\
          \            \"snippet\": snippet[:900],\n            \"site_name\": text(page.get(\"\
          siteName\")),\n            \"date\": (\n                text(page.get(\"\
          datePublished\"))\n                or text(page.get(\"dateLastCrawled\"\
          ))\n            ),\n        })\n\n    return {\n        \"query\": text(\n\
          \            (data.get(\"queryContext\") or {}).get(\"originalQuery\")\n\
          \        ),\n        \"results\": results,\n        \"results_json\": json.dumps(results,\
          \ ensure_ascii=False),\n        \"source_count\": len(results),\n    }\n"
        code_language: python3
        desc: 解析bocha返回的搜索结果
