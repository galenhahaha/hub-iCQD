        desc: 将用户输入判断为正向或负向情绪
        instruction: '只根据用户当前输入所表达的主要情绪分类。

          1. 明显积极、愉快或有好消息，归为“正向情绪”。

          2. 含有困扰、压力、痛苦、担忧、抱怨或求助，归为“负向情绪”。

          3. 同时包含正负情绪时，以用户最需要回应和支持的情绪为准；存在明显困扰时优先归为“负向情绪”。'
