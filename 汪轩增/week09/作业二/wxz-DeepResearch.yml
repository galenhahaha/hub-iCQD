        desc: 先拆研究维度，再生成首轮检索词，而不是直接开始搜索。
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: e005dac4-c75a-43a9-8d93-f4afb255b139
          role: system
          text: '你是 DeepResearch 的研究架构师。

            请先把用户问题拆成研究地图，再设计首轮联网检索计划。


            要求：

            1. 提取 3-5 个互补的研究维度；

            2. 给出 4-6 个搜索引擎可直接使用的检索词；

            3. 检索词要覆盖背景、主体、数据/证据、比较、最新变化、风险或争议；

            4. 不要直接回答用户问题；

            5. 只输出 JSON，不要 Markdown，不要额外解释。


            格式：

            {"focus":"一句话研究目标","dimensions":["维度1","维度2"],"queries":["检索词1","检索词2","检索词3"]}'
        - id: 5a5d330c-5105-4bc8-bd22-2ad002bce5be
          role: user
          text: 用户研究问题：{{#research_input.question#}}
        selected: false
        title: 构建研究地图
        type: llm
        variables: []
        vision:
          enabled: false
      height: 131
      id: scope_architect
      position:
        x: 220
        y: 360
      positionAbsolute:
        x: 220
        y: 360
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        code: "import json\nimport re\n\ndef main(text: str, question: str) -> dict:\n\
          \    raw = (text or \"\").strip()\n    m = re.search(r'\\{[\\s\\S]*\\}',\
          \ raw)\n    try:\n        obj = json.loads(m.group(0) if m else raw)\n \
          \   except Exception:\n        obj = {}\n\n    dims = []\n    for x in obj.get(\"\
          dimensions\", []) or []:\n        x = str(x).strip()\n        if x and x\
          \ not in dims:\n            dims.append(x)\n\n    queries = []\n    for\
          \ x in obj.get(\"queries\", []) or []:\n        x = str(x).strip()\n   \
          \     if x and x not in queries:\n            queries.append(x)\n\n    if\
          \ not queries:\n        queries = [question.strip()]\n\n    return {\n \
          \       \"focus\": str(obj.get(\"focus\", \"\")).strip() or question.strip(),\n\
          \        \"dimensions\": dims[:5],\n        \"queries\": queries[:6],\n\
          \    }"
        code_language: python3
        desc: 解析研究地图；若 JSON 解析失败则直接用原问题作为首轮搜索词。
        outputs:
          dimensions:
            children: null
            type: array[string]
          focus:
            children: null
            type: string
          queries:
            children: null
            type: array[string]
        selected: false
        title: 整理检索计划
        type: code
        variables:
        - value_selector:
          - scope_architect
          - text
          variable: text
        - value_selector:
          - research_input
          - question
          variable: question
