    - data:
        code: "import json\n\ndef _loads(v):\n    if isinstance(v, dict):\n      \
          \  return v\n    try:\n        return json.loads(v or \"{}\")\n    except\
          \ Exception:\n        return {}\n\ndef _pages(body):\n    obj = _loads(body)\n\
          \    return obj.get(\"data\", {}).get(\"webPages\", {}).get(\"value\", [])\
          \ or []\n\ndef main(question: str, q1: list, r1: list, q2: list, r2: list,\
          \ gap_reason: str) -> dict:\n    sources = []\n    seen = set()\n    dates\
          \ = []\n\n    for body in (r1 or []) + (r2 or []):\n        for p in _pages(body):\n\
          \            url = str(p.get(\"url\") or \"\").strip()\n            title\
          \ = str(p.get(\"name\") or p.get(\"title\") or \"\").strip()\n         \
          \   site = str(p.get(\"siteName\") or \"\").strip()\n            date =\
          \ str(p.get(\"datePublished\") or p.get(\"dateLastCrawled\") or \"\").strip()\n\
          \            if date:\n                dates.append(date[:10])\n       \
          \     if url and url not in seen:\n                seen.add(url)\n     \
          \           sources.append({\n                    \"id\": len(sources) +\
          \ 1,\n                    \"title\": title,\n                    \"site\"\
          : site,\n                    \"date\": date,\n                    \"url\"\
          : url,\n                })\n\n    n = len(sources)\n    confidence = \"\
          high\" if n >= 12 else (\"medium\" if n >= 6 else \"low\")\n    process\
          \ = {\n        \"question\": question,\n        \"initial_queries\": q1\
          \ or [],\n        \"verification_queries\": q2 or [],\n        \"gap_reason\"\
          : gap_reason,\n        \"source_count\": n,\n        \"search_waves\": 1\
          \ + (1 if q2 else 0),\n    }\n    confidence_info = {\n        \"overall\"\
          : confidence,\n        \"latest_source_date\": max(dates) if dates else\
