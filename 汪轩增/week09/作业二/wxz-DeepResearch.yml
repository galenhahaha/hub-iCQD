      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        code: "import json\nimport re\n\ndef main(text: str, old_queries: list) ->\
          \ dict:\n    raw = (text or \"\").strip()\n    m = re.search(r'\\{[\\s\\\
          S]*\\}', raw)\n    try:\n        obj = json.loads(m.group(0) if m else raw)\n\
          \    except Exception:\n        obj = {\"need_more\": False, \"reason\"\
          : \"解析失败，安全停止补检\", \"queries\": []}\n\n    old = {str(x).strip() for x in\
          \ (old_queries or [])}\n    need_more = bool(obj.get(\"need_more\", False))\n\
          \    queries = []\n    if need_more:\n        for x in obj.get(\"queries\"\
          , []) or []:\n            x = str(x).strip()\n            if x and x not\
          \ in old and x not in queries:\n                queries.append(x)\n\n  \
          \  return {\n        \"need_more\": need_more and bool(queries),\n     \
          \   \"reason\": str(obj.get(\"reason\", \"\")).strip(),\n        \"queries\"\
          : queries[:4],\n    }"
        code_language: python3
        desc: 解析第二轮定向搜索词；若无需补检则输出空数组，第二轮自动无操作。
        outputs:
          need_more:
            children: null
            type: boolean
          queries:
            children: null
            type: array[string]
          reason:
            children: null
            type: string
        selected: false
        title: 生成复核清单
        type: code
        variables:
        - value_selector:
          - gap_mapper
          - text
          variable: text
        - value_selector:
