        desc: 根据研究地图和首轮证据，判断哪些问题仍需要第二轮定向检索。
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: deepseek-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: fdf41c3d-802d-4afb-838e-c11e8d4aa4d4
          role: system
          text: '你是 DeepResearch 的证据缺口审查员。


            检查当前证据是否存在以下问题：

            1. 某个研究维度基本没有来源；

            2. 关键结论只有单一来源；

            3. 缺少最新信息、数据或直接对比；

            4. 存在来源冲突但没有交叉验证；

            5. 仍有会显著影响最终结论的问题未解决。


            如果需要补检，最多输出 4 个新的、具体的检索词。

            如果无需补检，queries 必须为空数组。


            只输出 JSON：

            {"need_more":true,"reason":"原因","queries":["补检词1","补检词2"]}'
        - id: c230201b-f36c-4873-a0eb-8eea97b79451
          role: user
          text: '原始问题：{{#research_input.question#}}

            研究维度：{{#plan_unpacker.dimensions#}}

            已执行检索：{{#plan_unpacker.queries#}}


            首轮证据摘要：

            {{#first_pass_digest.text#}}'
        selected: false
        title: 绘制证据缺口
        type: llm
        variables: []
        vision:
          enabled: false
      height: 131
      id: gap_mapper
      position:
        x: 1800
        y: 360
      positionAbsolute:
        x: 1800
        y: 360
      selected: false
